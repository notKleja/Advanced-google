<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Advanced Google Search</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="search-panel">
      <div class="logo" aria-label="Google">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
      </div>
      <form id="searchForm">
        <div class="search-container">
          <button class="icon-button" id="searchIconButton" type="button" aria-label="Search">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5ZM9.5 14A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
          </button>
          <label class="visually-hidden" for="query">Search query</label>
          <input type="search" id="query" autocomplete="off" required autofocus>
        </div>
        <div class="primary-actions">
          <button type="submit">Google Search</button>
          <button type="button" id="newTabButton">Search in new tab</button>
        </div>
        <section class="advanced-filters" aria-labelledby="advancedFiltersHeading">
          <h2 id="advancedFiltersHeading">Advanced filters</h2>
          <div class="action-row">
            <button type="button" data-selection-action="exact">Exact phrase</button>
            <button type="button" data-selection-action="exclude">Exclude selection</button>
            <button type="button" data-selection-action="clear">Remove selection filters</button>
          </div>
          <div class="filter-row">
            <div class="filter-group">
              <label for="siteFilter">Site</label>
              <div class="filter-control">
                <select id="siteFilter">
                  <option value="">Any site</option>
                  <optgroup label="Social and general">
                    <option value="reddit.com">Reddit</option>
                    <option value="twitter.com">Twitter</option>
                    <option value="wikipedia.org">Wikipedia</option>
                  </optgroup>
                  <optgroup label="Development">
                    <option value="stackoverflow.com">Stack Overflow</option>
                    <option value="github.com">GitHub</option>
                    <option value="developer.mozilla.org">MDN Web Docs</option>
                    <option value="codepen.io">CodePen</option>
                    <option value="dev.to">Dev.to</option>
                  </optgroup>
                  <optgroup label="Design">
                    <option value="dribbble.com">Dribbble</option>
                    <option value="behance.net">Behance</option>
                    <option value="figma.com/community">Figma Community</option>
                    <option value="uxdesign.cc">UX Design</option>
                    <option value="smashingmagazine.com">Smashing Magazine</option>
                  </optgroup>
                  <optgroup label="Other">
                    <option value="*.edu">Education sites</option>
                    <option value="custom">Custom site</option>
                  </optgroup>
                </select>
                <button type="button" class="clear-button" id="clearSite" aria-label="Clear site filter" hidden>×</button>
              </div>
              <label class="visually-hidden" for="customSite">Custom site domain</label>
              <input class="custom-filter" id="customSite" type="text" placeholder="example.com" inputmode="url" hidden>
            </div>
            <div class="filter-group">
              <label for="fileTypeFilter">File type</label>
              <div class="filter-control">
                <select id="fileTypeFilter">
                  <option value="">Any file type</option>
                  <optgroup label="Documents and ebooks">
                    <option value="pdf">PDF</option>
                    <option value="doc">Word document (DOC)</option>
                    <option value="docx">Word document (DOCX)</option>
                    <option value="odt">OpenDocument text (ODT)</option>
                    <option value="rtf">Rich Text Format (RTF)</option>
                    <option value="txt">Plain text (TXT)</option>
                    <option value="epub">Ebook (EPUB)</option>
                  </optgroup>
                  <optgroup label="Spreadsheets">
                    <option value="xls">Excel spreadsheet (XLS)</option>
                    <option value="xlsx">Excel spreadsheet (XLSX)</option>
                    <option value="ods">OpenDocument spreadsheet (ODS)</option>
                    <option value="csv">Comma-separated values (CSV)</option>
                  </optgroup>
                  <optgroup label="Presentations">
                    <option value="ppt">PowerPoint presentation (PPT)</option>
                    <option value="pptx">PowerPoint presentation (PPTX)</option>
                    <option value="odp">OpenDocument presentation (ODP)</option>
                  </optgroup>
                  <optgroup label="Images and design">
                    <option value="jpg">JPEG image (JPG)</option>
                    <option value="png">PNG image</option>
                    <option value="gif">GIF image</option>
                    <option value="svg">Scalable vector graphic (SVG)</option>
                    <option value="webp">WebP image</option>
                    <option value="tiff">TIFF image</option>
                    <option value="psd">Photoshop document (PSD)</option>
                  </optgroup>
                  <optgroup label="Audio and video">
                    <option value="mp3">MP3 audio</option>
                    <option value="wav">WAV audio</option>
                    <option value="mp4">MP4 video</option>
                    <option value="webm">WebM video</option>
                    <option value="mov">QuickTime video (MOV)</option>
                  </optgroup>
                  <optgroup label="Archives and disk images">
                    <option value="zip">ZIP archive</option>
                    <option value="rar">RAR archive</option>
                    <option value="7z">7-Zip archive</option>
                    <option value="tar">TAR archive</option>
                    <option value="gz">Gzip archive</option>
                    <option value="iso">Disk image (ISO)</option>
                  </optgroup>
                  <optgroup label="Data and configuration">
                    <option value="json">JSON data</option>
                    <option value="xml">XML data</option>
                    <option value="yaml">YAML configuration</option>
                    <option value="sql">SQL database script</option>
                    <option value="sqlite">SQLite database</option>
                  </optgroup>
                  <optgroup label="Code and web">
                    <option value="html">HTML document</option>
                    <option value="css">CSS stylesheet</option>
                    <option value="js">JavaScript source</option>
                    <option value="ts">TypeScript source</option>
                    <option value="py">Python source</option>
                    <option value="java">Java source</option>
                    <option value="cpp">C++ source</option>
                    <option value="go">Go source</option>
                    <option value="rs">Rust source</option>
                  </optgroup>
                  <optgroup label="Other">
                    <option value="custom">Custom file type</option>
                  </optgroup>
                </select>
                <button type="button" class="clear-button" id="clearFileType" aria-label="Clear file type filter" hidden>×</button>
              </div>
              <label class="visually-hidden" for="customFileType">Custom file extension</label>
              <input class="custom-filter" id="customFileType" type="text" placeholder="Extension, such as csv" hidden>
            </div>
          </div>
          <p id="filterStatus" class="visually-hidden" role="status" aria-live="polite"></p>
        </section>
      </form>
    </main>
    <button id="invisible-footer" type="button" aria-label="Enter distraction-free fullscreen"></button>
  </body>
</html>
